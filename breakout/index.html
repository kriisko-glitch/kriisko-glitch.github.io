<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Breakout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d0d1a;--text:#eeeeee;--paddle:#e94560}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
    body{display:grid;place-items:center;padding:16px}
    .game-wrap{width:min(100%,560px);display:grid;gap:12px;justify-items:center}
    .hud{width:min(100%,480px);display:flex;justify-content:space-between;align-items:center;font-size:1rem;letter-spacing:0.02em;user-select:none;font-family:'Orbitron',sans-serif}
    .canvas-frame{width:min(100%,480px);border:1px solid rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,0.45);background:var(--bg)}
    canvas{display:block;width:100%;height:auto;aspect-ratio:4 / 5;touch-action:none;background:var(--bg)}
    .vignette-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(0deg,rgba(0,0,0,0.9),rgba(0,0,0,0.5));z-index:1;pointer-events:none}
    .meta-row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; font-family: 'Orbitron', sans-serif; margin-top: 4px; }
    .chip { font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #eee; }
    .chip.gold { color: #ffd54f; border-color: rgba(255,213,79,0.4); }
    .chip.cyan { color: #00e5ff; border-color: rgba(0,229,255,0.4); }
    .chip.rose { color: #ff4081; border-color: rgba(255,64,129,0.4); }
    .overlay-modal {
  position: fixed; inset: 0;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.86); z-index: 50; padding: 1rem;
  font-family: 'Orbitron', sans-serif; color: #fff;
    }
    .overlay-modal h2 { margin: 0 0 0.5rem; color: #ffd54f; }
    .overlay-modal p { margin: 0 0 1rem; opacity: 0.9; font-size: 0.85rem; text-align: center; }
    .diff-row { display: flex; gap: 6px; margin-bottom: 1rem; }
    .diff-btn {
  padding: 0.4rem 0.8rem; font-size: 0.85rem;
  cursor: pointer; background: #0f3460; color: #fff;
  border: 2px solid transparent; border-radius: 6px; font-family: inherit;
    }
    .diff-btn.active { border-color: #e94560; background: #16315f; }
    .diff-btn:hover { background: #16315f; }
    .go-btn {
  padding: 0.55rem 1.25rem; font-size: 0.95rem; cursor: pointer;
  background: #e94560; color: #fff; border: none; border-radius: 6px;
  font-weight: 600; font-family: inherit;
    }
    .go-btn:hover { background: #ff6b6b; }
    .upgrade-card {
  background: #0f3460; border: 2px solid #2a4a7f;
  border-radius: 8px; padding: 0.6rem 0.8rem; margin: 4px 0;
  cursor: pointer; min-width: 240px; text-align: left;
  color: #fff; font-family: inherit;
    }
    .upgrade-card:hover { border-color: #e94560; background: #16315f; }
    .upgrade-card .uname { font-size: 0.95rem; color: #ffd54f; display: block; margin-bottom: 3px; }
    .upgrade-card .udesc { font-size: 0.72rem; opacity: 0.85; }
    .ach-toast {
  position: fixed; top: 18px; right: 18px;
  background: linear-gradient(135deg,#0f3460,#e94560);
  padding: 10px 14px; border-radius: 8px;
  color: #fff; font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
  box-shadow: 0 4px 20px rgba(233,69,96,0.5);
  z-index: 100; pointer-events: none;
  animation: slideInBr 2.5s ease-out forwards;
    }
    @keyframes slideInBr {
  0% { transform: translateX(120%); opacity: 0; }
  12% { transform: translateX(0); opacity: 1; }
  85% { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(120%); opacity: 0; }
    }
  </style>
</head>
<body data-mobile-controls="drag">
  <main class="game-wrap">
    <section class="hud" aria-live="polite">
  <div id="score-display">Score: 0</div>
  <button id="scores-btn" style="padding:4px 12px;font-size:0.8rem;cursor:pointer;background:#0f3460;color:#fff;border:none;border-radius:4px;" onclick="if(window.KriiskoLeaderboard)window.KriiskoLeaderboard.show('breakout')">&#127942; Scores</button>
  <div id="level-display">Level: 1</div>
    </section>
    <section class="meta-row">
  <span class="chip gold" id="coin-chip">&#9733; 0</span>
  <span class="chip cyan" id="best-chip">Best 0</span>
  <span class="chip rose" id="diff-chip">Normal</span>
    </section>
    <div class="canvas-frame">
  <canvas id="game-canvas" width="480" height="600"></canvas>
  <div class="vignette-overlay"></div>
    </div>
  </main>
  <div id="start-modal" class="overlay-modal">
    <h2>Breakout</h2>
    <p>Pick a difficulty. Upgrades every 5 bricks destroyed.</p>
    <div class="diff-row" id="diff-row">
  <button class="diff-btn" data-diff="easy">Easy</button>
  <button class="diff-btn active" data-diff="normal">Normal</button>
  <button class="diff-btn" data-diff="hard">Hard</button>
    </div>
    <button class="go-btn" id="start-btn">Start</button>
  </div>
  <div id="upgrade-modal" class="overlay-modal">
    <h2>Level Up!</h2>
    <p>Pick one upgrade</p>
    <div id="upgrade-choices"></div>
  </div>
  <script src="../shared/kriisko-juice.js"></script>
  <script src="../shared/kriisko-meta.js"></script>
  <script src="../shared/leaderboard.js"></script>
  <script src="../shared/mobile-controls.js"></script>
  <script src="../shared/feedback.js"></script>
  <script>
    (function() {
  const SLUG = 'breakout';

  function isLeaderboardVisible() {
    return !!document.getElementById('klb-initials-overlay') ||
       !!document.getElementById('klb-show-overlay');
  }

  // ========= META PROGRESSION =========
  function lget(k, d) { try { const v = localStorage.getItem('kriisko:' + SLUG + ':' + k); return v === null ? d : v; } catch (_) { return d; } }
  function lset(k, v) { try { localStorage.setItem('kriisko:' + SLUG + ':' + k, String(v)); } catch (_) {} }
  function getCoins()   { return parseInt(lget('coins', '0'), 10) || 0; }
  function addCoins(n)  { lset('coins', getCoins() + n); }
  function getBest()    { return parseInt(lget('best',  '0'), 10) || 0; }
  function setBest(n)   { if (n > getBest()) lset('best', n); }
  function getUnlocked(){ try { return JSON.parse(lget('ach', '[]')); } catch (_) { return []; } }
  function unlock(id, name) {
    const arr = getUnlocked();
    if (arr.includes(id)) return false;
    arr.push(id); lset('ach', JSON.stringify(arr));
    const el = document.createElement('div');
    el.className = 'ach-toast'; el.textContent = 'Achievement: ' + name;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
    return true;
  }

  // ========= DIFFICULTY =========
  const DIFFICULTIES = {
    easy:   { speedMod: 0.8, spawnChance: 0.22, name: 'Easy',  paddleMod: 1.2, pointsMod: 0.9 },
    normal: { speedMod: 1.0, spawnChance: 0.15, name: 'Normal',paddleMod: 1.0, pointsMod: 1.0 },
    hard:   { speedMod: 1.25,spawnChance: 0.10, name: 'Hard',  paddleMod: 0.85,pointsMod: 1.3 }
  };
  let selectedMode = lget('difficulty', 'normal');

  // ========= ENEMY/BRICK TYPE VARIETY =========
  class EnemyBrick {
    constructor(row, col, x, y) { this.row = row; this.col = col; this.x = x; this.y = y; this.alive = true; this.isPowerBrick = false; this.type = 'standard'; this.hp = 1; }
  }
  class EnemyToughBrick extends EnemyBrick {
    constructor(row, col, x, y) { super(row, col, x, y); this.type = 'tough'; this.hp = 2; }
  }
  class EnemyBomberBrick extends EnemyBrick {
    constructor(row, col, x, y) { super(row, col, x, y); this.type = 'bomber'; this.hp = 1; this.isPowerBrick = true; }
  }
  const ENEMY_TYPES = [
    { name: 'standard', ctor: EnemyBrick,       weight: 0.70 },
    { name: 'tough',    ctor: EnemyToughBrick,  weight: 0.20 },
    { name: 'bomber',   ctor: EnemyBomberBrick, weight: 0.10 }
  ];
  function pickEnemyCtor() {
    const r = Math.random();
    let acc = 0;
    for (const e of ENEMY_TYPES) { acc += e.weight; if (r < acc) return e.ctor; }
    return EnemyBrick;
  }

  // ========= UPGRADE POOL =========
  const UPGRADE_POOL = [
    { id: 'multiball', name: 'Multi Ball',    desc: 'Spawn 2 extra balls now' },
    { id: 'wider',     name: 'Wider Paddle',  desc: '+20% paddle width (permanent)' },
    { id: 'sticky',    name: 'Sticky Paddle', desc: 'Balls bounce with spin boost' },
    { id: 'laser',     name: 'Laser Paddle',  desc: '15s laser burst now' },
    { id: 'slowball',  name: 'Slow Ball',     desc: '15s slow-motion' },
    { id: 'points',    name: 'Scholar',       desc: '+30% points per brick' },
    { id: 'bigball',   name: 'Big Ball',      desc: '15s oversized ball' }
  ];

  // ========= ACHIEVEMENTS =========
  const ACHIEVEMENTS = [
    { id: 'first_brick', name: 'First Brick',    test: s => s.score >= 1 },
    { id: 'score_100',   name: 'Centurion',      test: s => s.score >= 100 },
    { id: 'score_500',   name: 'Brick Master',   test: s => s.score >= 500 },
    { id: 'level_3',     name: 'Third Floor',    test: s => s.level >= 3 },
    { id: 'multi_ball',  name: 'Triple Threat',  test: s => s.ballCount >= 3 },
    { id: 'hard_mode',   name: 'Hard Mode Hero', test: s => s.mode === 'hard' && s.score >= 150 },
    { id: 'no_upgrades', name: 'Purist',         test: s => s.gameOver && s.upgradesChosen === 0 && s.score >= 80 },
    { id: 'coin_100',    name: 'Hoarder',        test: s => s.totalCoins >= 100 }
  ];

  // CONSTANTS
  const CANVAS_WIDTH = 480;
  const CANVAS_HEIGHT = 600;
  const DPR_MAX = 2;

  const COLORS = {
    background: "#0d0d1a",
    paddle: "#e94560",
    ball: "#ffffff",
    text: "#eeeeee",
    brickRows: ["#e94560", "#ff6b35", "#ffc107", "#4caf50", "#00bcd4", "#9c27b0"],
    powerupWide: "#3fa9f5",
    powerupMulti: "#ffd54f"
  };

  const GAME_STATES = {
    IDLE: "IDLE",
    PLAYING: "PLAYING",
    DEAD: "DEAD",
    WIN: "WIN"
  };

  const PADDLE_BASE_WIDTH = 96;
  const PADDLE_HEIGHT = 14;
  const PADDLE_Y_OFFSET = 40;
  const PADDLE_SPEED = 420;

  const BALL_RADIUS = 7;
  const BALL_BASE_SPEED = 280;
  const BALL_SPEED_GROWTH = 1.1;
  const BALL_LAUNCH_ANGLE = Math.PI / 4;
  const BALL_MAX = 16;

  const BRICK_COLS = 8;
  const BRICK_ROWS = 6;
  const BRICK_WIDTH = 52;
  const BRICK_HEIGHT = 20;
  const BRICK_GAP = 4;
  const BRICK_TOP = 72;
  const BRICK_LEFT = (CANVAS_WIDTH - (BRICK_COLS * BRICK_WIDTH + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const BRICK_ROW_POINTS = [7, 5, 3, 3, 1, 1];

  const MIN_BOUNCE_ANGLE = (30 * Math.PI) / 180;
  const MAX_BOUNCE_ANGLE = (75 * Math.PI) / 180;

  const WIN_FLASH_MS = 900;

  const POWERUP_SPAWN_LEVEL = 3;
  const POWERUP_SPAWN_CHANCE = 0.15;
  const POWERUP_SIZE = { w: 22, h: 14 };
  const POWERUP_FALL_SPEED = 180;
  const WIDE_PADDLE_MULTIPLIER = 1.5;
  const WIDE_PADDLE_DURATION_MS = 10_000;
  const LASER_PADDLE_DURATION_MS = 10_000;
  const SLOW_BALL_DURATION_MS = 10_000;
  const SLOW_BALL_MULTIPLIER = 0.6;
  const BIG_BALL_DURATION_MS = 10_000;
  const BIG_BALL_RADIUS = BALL_RADIUS * 2;
  const LASER_FIRE_COOLDOWN_MS = 300;

  const KEY_LEFT = "ArrowLeft";
  const KEY_RIGHT = "ArrowRight";
  const KEY_SPACE = "Space";

  // STATE
  const canvas = document.getElementById("game-canvas");
  const ctx = canvas.getContext("2d");
  const scoreDisplay = document.getElementById("score-display");
  const levelDisplay = document.getElementById("level-display");

  const input = {
    leftHeld: false,
    rightHeld: false,
    pointerActive: false,
    pointerX: CANVAS_WIDTH / 2
  };

  const game = {
    state: GAME_STATES.IDLE,
    score: 0,
    level: 1,
    levelSpeed: BALL_BASE_SPEED,
    lastFrameTime: performance.now(),
    winFlashUntil: 0,
    bricksLeft: 0,
    bricks: [],
    balls: [],
    powerups: [],
    paddle: {
      x: (CANVAS_WIDTH - PADDLE_BASE_WIDTH) / 2,
      y: CANVAS_HEIGHT - PADDLE_Y_OFFSET,
      width: PADDLE_BASE_WIDTH,
      height: PADDLE_HEIGHT,
      prevX: (CANVAS_WIDTH - PADDLE_BASE_WIDTH) / 2,
      velocity: 0
    },
    widePaddleUntil: 0,
    laserPaddleUntil: 0,
    slowBallUntil: 0,
    bigBallUntil: 0,
    activePowerup: null,
    laserBullets: [],
    lastLaserFireAt: 0,
    // depth state
    upgrades: [],
    upgradesChosen: 0,
    bricksDestroyed: 0,
    nextUpgradeAt: 5,
    paddleWidthBonus: 1.0,
    pointMult: 1.0,
    stickyBoost: 0,
    runCoins: 0,
    paused: false,
    started: false
  };

  // ========= DEPTH UI =========
  const startModal = document.getElementById('start-modal');
  const upgradeModal = document.getElementById('upgrade-modal');
  const upgradeChoicesEl = document.getElementById('upgrade-choices');
  const diffRow = document.getElementById('diff-row');
  const startBtn = document.getElementById('start-btn');
  const coinChipEl = document.getElementById('coin-chip');
  const bestChipEl = document.getElementById('best-chip');
  const diffChipEl = document.getElementById('diff-chip');

  function updateChips() {
    coinChipEl.innerHTML = '&#9733; ' + getCoins();
    bestChipEl.textContent = 'Best ' + getBest();
    diffChipEl.textContent = DIFFICULTIES[selectedMode].name;
  }
  function showStartModal() { startModal.style.display = 'flex'; }
  function hideStartModal() { startModal.style.display = 'none'; }

  Array.from(diffRow.querySelectorAll('.diff-btn')).forEach(btn => {
    if (btn.getAttribute('data-diff') === selectedMode) btn.classList.add('active');
    else btn.classList.remove('active');
    btn.addEventListener('click', () => {
      selectedMode = btn.getAttribute('data-diff');
      lset('difficulty', selectedMode);
      Array.from(diffRow.querySelectorAll('.diff-btn')).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateChips();
    });
  });
  startBtn.addEventListener('click', () => {
    hideStartModal();
    game.started = true;
    restartGame();
  });

  function chooseUpgrade() {
    if (game.paused) return;
    game.paused = true;
    const pool = UPGRADE_POOL.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const choices = pool.slice(0, 3);
    upgradeChoicesEl.innerHTML = '';
    choices.forEach(u => {
      const b = document.createElement('button');
      b.className = 'upgrade-card';
      b.innerHTML = '<span class="uname">' + u.name + '</span><span class="udesc">' + u.desc + '</span>';
      b.addEventListener('click', () => pickUpgrade(u));
      upgradeChoicesEl.appendChild(b);
    });
    upgradeModal.style.display = 'flex';
  }
  function pickUpgrade(u) {
    game.upgrades.push(u.id);
    game.upgradesChosen++;
    applyUpgrade(u.id);
    upgradeModal.style.display = 'none';
    game.paused = false;
  }
  function applyUpgrade(id) {
    const now = performance.now();
    if (id === 'multiball') {
      const source = game.balls[0];
      if (source) {
    const baseSpeed = Math.hypot(source.vx, source.vy) || currentBallSpeed();
    const baseAngle = Math.atan2(-source.vy, source.vx);
    [-Math.PI/10, Math.PI/10].forEach(off => {
      if (game.balls.length >= BALL_MAX) return;
      game.balls.push({
        x: source.x, y: source.y,
        vx: Math.cos(baseAngle + off) * baseSpeed,
        vy: -Math.sin(baseAngle + off) * baseSpeed,
        radius: BALL_RADIUS
      });
    });
      }
    }
    if (id === 'wider')    { game.paddleWidthBonus += 0.2; setPaddleWidth(PADDLE_BASE_WIDTH * game.paddleWidthBonus * DIFFICULTIES[selectedMode].paddleMod); }
    if (id === 'sticky')   { game.stickyBoost += 0.2; }
    if (id === 'laser')    { game.laserPaddleUntil = now + 15000; game.activePowerup = { name: 'Laser', until: game.laserPaddleUntil }; }
    if (id === 'slowball') { game.slowBallUntil = now + 15000; for (const ball of game.balls) { ball.vx *= SLOW_BALL_MULTIPLIER; ball.vy *= SLOW_BALL_MULTIPLIER; } game.activePowerup = { name: 'Slow', until: game.slowBallUntil }; }
    if (id === 'points')   { game.pointMult += 0.3; }
    if (id === 'bigball')  { game.bigBallUntil = now + 15000; for (const ball of game.balls) ball.radius = BIG_BALL_RADIUS; game.activePowerup = { name: 'Big', until: game.bigBallUntil }; }
  }

  function checkAchievements(opts) {
    const stats = {
      score: game.score,
      level: game.level,
      mode: selectedMode,
      ballCount: game.balls.length,
      upgradesChosen: game.upgradesChosen,
      totalCoins: getCoins(),
      gameOver: !!opts && !!opts.gameOver
    };
    const unlocked = getUnlocked();
    for (const a of ACHIEVEMENTS) {
      if (!unlocked.includes(a.id) && a.test(stats)) unlock(a.id, a.name);
    }
  }

  // INPUT
  window.addEventListener("keydown", (event) => {
    if (event.code === KEY_LEFT) {
      input.leftHeld = true;
      input.pointerActive = false;
    } else if (event.code === KEY_RIGHT) {
      input.rightHeld = true;
      input.pointerActive = false;
    } else if (event.code === KEY_SPACE) {
      event.preventDefault();
      if (game.state === GAME_STATES.IDLE) {
    if (!isLeaderboardVisible()) startPlayFromIdle();
      } else if (game.state === GAME_STATES.DEAD) {
    if (isLeaderboardVisible()) return;
    restartGame();
      } else if (game.state === GAME_STATES.PLAYING) {
    const now = performance.now();
    if (game.laserPaddleUntil > now && now - game.lastLaserFireAt >= LASER_FIRE_COOLDOWN_MS) {
      game.lastLaserFireAt = now;
      game.laserBullets.push({
        x: game.paddle.x + game.paddle.width / 2,
        y: game.paddle.y - 4,
        vy: -500
      });
    }
      }
    }
  });

  window.addEventListener("keyup", (event) => {
    if (event.code === KEY_LEFT) input.leftHeld = false;
    if (event.code === KEY_RIGHT) input.rightHeld = false;
  });

  const updatePointer = (clientX) => {
    const rect = canvas.getBoundingClientRect();
    const ratio = CANVAS_WIDTH / rect.width;
    input.pointerX = (clientX - rect.left) * ratio;
    input.pointerActive = true;
  };

  canvas.addEventListener("mousemove", (event) => updatePointer(event.clientX));
  canvas.addEventListener("mousedown", (event) => {
    updatePointer(event.clientX);
    if (game.state === GAME_STATES.IDLE && !isLeaderboardVisible()) startPlayFromIdle();
    if (game.state === GAME_STATES.DEAD) {
      if (isLeaderboardVisible()) return;
      restartGame();
    }
  });

  canvas.addEventListener("touchstart", (event) => {
    const touch = event.touches[0];
    if (!touch) return;
    updatePointer(touch.clientX);
    if (game.state === GAME_STATES.IDLE && !isLeaderboardVisible()) startPlayFromIdle();
    if (game.state === GAME_STATES.DEAD) {
      if (isLeaderboardVisible()) return;
      restartGame();
    }
  }, { passive: true });

  canvas.addEventListener("touchmove", (event) => {
    const touch = event.touches[0];
    if (!touch) return;
    updatePointer(touch.clientX);
  }, { passive: true });

  // PHYSICS
  function buildBrickField() {
    game.bricks = [];
    game.bricksLeft = 0;
    for (let row = 0; row < BRICK_ROWS; row += 1) {
      for (let col = 0; col < BRICK_COLS; col += 1) {
    const x = BRICK_LEFT + col * (BRICK_WIDTH + BRICK_GAP);
    const y = BRICK_TOP + row * (BRICK_HEIGHT + BRICK_GAP);
    const Ctor = pickEnemyCtor();
    const brick = new Ctor(row, col, x, y);
    if (brick.type === 'standard' && Math.random() < 0.2) brick.isPowerBrick = true;
    game.bricks.push(brick);
    game.bricksLeft += 1;
      }
    }
  }

  function clampPaddle() {
    game.paddle.x = Math.max(0, Math.min(CANVAS_WIDTH - game.paddle.width, game.paddle.x));
  }

  function setPaddleWidth(width) {
    const center = game.paddle.x + game.paddle.width / 2;
    game.paddle.width = width;
    game.paddle.x = center - game.paddle.width / 2;
    clampPaddle();
  }

  function currentBallSpeed() {
    return game.levelSpeed;
  }

  function createBall(x, y, angle, speed = currentBallSpeed()) {
    return {
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: -Math.abs(Math.sin(angle) * speed),
      radius: BALL_RADIUS
    };
  }

  function setIdleBall() {
    game.balls = [
      createBall(
    game.paddle.x + game.paddle.width / 2,
    game.paddle.y - BALL_RADIUS - 2,
    BALL_LAUNCH_ANGLE
      )
    ];
  }

  function startPlayFromIdle() {
    game.state = GAME_STATES.PLAYING;
    game.balls[0] = createBall(
      game.paddle.x + game.paddle.width / 2,
      game.paddle.y - BALL_RADIUS - 2,
      BALL_LAUNCH_ANGLE
    );
  }

  function beginLevel(level) {
    game.level = level;
    const diff = DIFFICULTIES[selectedMode];
    game.levelSpeed = BALL_BASE_SPEED * Math.pow(BALL_SPEED_GROWTH, level - 1) * diff.speedMod;
    buildBrickField();
    game.powerups = [];
    game.widePaddleUntil = 0;
    game.laserPaddleUntil = 0;
    game.slowBallUntil = 0;
    game.bigBallUntil = 0;
    game.activePowerup = null;
    game.laserBullets = [];
    game.lastLaserFireAt = 0;
    setPaddleWidth(PADDLE_BASE_WIDTH * game.paddleWidthBonus * diff.paddleMod);
    game.paddle.x = (CANVAS_WIDTH - game.paddle.width) / 2;
    setIdleBall();
    if (level === 1) {
      game.state = GAME_STATES.IDLE;
    } else {
      game.state = GAME_STATES.WIN;
      game.winFlashUntil = performance.now() + WIN_FLASH_MS;
    }
    syncHud();
  }

  function restartGame() {
    game.score = 0;
    game.upgrades = [];
    game.upgradesChosen = 0;
    game.bricksDestroyed = 0;
    game.nextUpgradeAt = 5;
    game.paddleWidthBonus = 1.0;
    game.pointMult = 1.0;
    game.stickyBoost = 0;
    game.runCoins = 0;
    game.paused = false;
    beginLevel(1);
  }

  function spawnPowerup(brickX, brickY, forced) {
    if (!forced) {
      if (game.level < POWERUP_SPAWN_LEVEL) return;
      const chance = DIFFICULTIES[selectedMode] ? DIFFICULTIES[selectedMode].spawnChance : POWERUP_SPAWN_CHANCE;
      if (Math.random() > chance) return;
    }
    const TYPES = ["wide", "multi", "laser", "slow", "big"];
    const type = TYPES[Math.floor(Math.random() * TYPES.length)];
    game.powerups.push({
      type,
      x: brickX + BRICK_WIDTH / 2 - POWERUP_SIZE.w / 2,
      y: brickY + BRICK_HEIGHT / 2 - POWERUP_SIZE.h / 2,
      w: POWERUP_SIZE.w,
      h: POWERUP_SIZE.h,
      vy: POWERUP_FALL_SPEED
    });
  }

  function applyPowerup(type) {
    const now = performance.now();

    if (type === "wide") {
      setPaddleWidth(PADDLE_BASE_WIDTH * WIDE_PADDLE_MULTIPLIER);
      game.widePaddleUntil = now + WIDE_PADDLE_DURATION_MS;
      game.activePowerup = { name: "Wide Paddle", until: game.widePaddleUntil };
      return;
    }

    if (type === "multi" && game.balls.length < BALL_MAX) {
      const source = game.balls[0];
      if (!source) return;
      const baseSpeed = Math.hypot(source.vx, source.vy) || currentBallSpeed();
      const baseAngle = Math.atan2(-source.vy, source.vx);
      const offsets = [(-18 * Math.PI) / 180, (18 * Math.PI) / 180];
      for (const offset of offsets) {
    if (game.balls.length >= BALL_MAX) break;
    const angle = baseAngle + offset;
    const r = game.bigBallUntil > now ? BIG_BALL_RADIUS : BALL_RADIUS;
    game.balls.push({
      x: source.x,
      y: source.y,
      vx: Math.cos(angle) * baseSpeed,
      vy: -Math.sin(angle) * baseSpeed,
      radius: r
    });
      }
      game.activePowerup = { name: "Multi Ball", until: now + 5000 };
      return;
    }

    if (type === "laser") {
      game.laserPaddleUntil = now + LASER_PADDLE_DURATION_MS;
      game.activePowerup = { name: "Laser Paddle", until: game.laserPaddleUntil };
      return;
    }

    if (type === "slow") {
      game.slowBallUntil = now + SLOW_BALL_DURATION_MS;
      for (const ball of game.balls) {
    ball.vx *= SLOW_BALL_MULTIPLIER;
    ball.vy *= SLOW_BALL_MULTIPLIER;
      }
      game.activePowerup = { name: "Slow Ball", until: game.slowBallUntil };
      return;
    }

    if (type === "big") {
      game.bigBallUntil = now + BIG_BALL_DURATION_MS;
      for (const ball of game.balls) {
    ball.radius = BIG_BALL_RADIUS;
      }
      game.activePowerup = { name: "Big Ball", until: game.bigBallUntil };
    }
  }

  function circleRectCollision(ball, rect) {
    const closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
    const closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
    const dx = ball.x - closestX;
    const dy = ball.y - closestY;
    return dx * dx + dy * dy <= ball.radius * ball.radius;
  }

  function resolvePaddleCollision(ball) {
    const paddleRect = {
      x: game.paddle.x,
      y: game.paddle.y,
      w: game.paddle.width,
      h: game.paddle.height
    };
    if (!circleRectCollision(ball, paddleRect) || ball.vy <= 0) return;

    const paddleCenter = game.paddle.x + game.paddle.width / 2;
    const hitOffset = (ball.x - paddleCenter) / (game.paddle.width / 2);
    const clamped = Math.max(-1, Math.min(1, hitOffset));
    const ratio = Math.abs(clamped);
    const angle = MIN_BOUNCE_ANGLE + (MAX_BOUNCE_ANGLE - MIN_BOUNCE_ANGLE) * ratio;
    const speed = Math.hypot(ball.vx, ball.vy) || currentBallSpeed();

    ball.vx = Math.sign(clamped || 1) * Math.cos(angle) * speed;
    ball.vy = -Math.sin(angle) * speed;
    ball.vx += (game.paddle.velocity || 0) * 0.3;
    ball.y = game.paddle.y - ball.radius - 0.5;
  }

  function resolveBrickCollision(ball, dt) {
    for (const brick of game.bricks) {
      if (!brick.alive) continue;
      const rect = { x: brick.x, y: brick.y, w: BRICK_WIDTH, h: BRICK_HEIGHT };
      if (!circleRectCollision(ball, rect)) continue;

      brick.hp = (brick.hp || 1) - 1;
      if (brick.hp <= 0) {
    brick.alive = false;
    game.bricksLeft -= 1;
    const base = BRICK_ROW_POINTS[brick.row];
    const typeBonus = brick.type === 'tough' ? 2 : brick.type === 'bomber' ? 3 : 1;
    game.score += Math.round(base * typeBonus * game.pointMult * DIFFICULTIES[selectedMode].pointsMod);
    game.runCoins += brick.type === 'bomber' ? 2 : 1;
    game.bricksDestroyed += 1;
    syncHud();
    spawnPowerup(brick.x, brick.y, brick.isPowerBrick || brick.type === 'bomber');
    // Bomber destroys adjacent bricks
    if (brick.type === 'bomber') {
      for (const b2 of game.bricks) {
        if (!b2.alive || b2 === brick) continue;
        if (Math.abs(b2.row - brick.row) <= 1 && Math.abs(b2.col - brick.col) <= 1) {
      b2.alive = false; b2.hp = 0;
      game.bricksLeft -= 1;
      game.bricksDestroyed += 1;
      game.score += Math.round(BRICK_ROW_POINTS[b2.row] * game.pointMult);
        }
      }
    }
    // Upgrade milestone every 5 bricks
    if (game.bricksDestroyed >= game.nextUpgradeAt) {
      game.nextUpgradeAt += 5;
      checkAchievements();
      setTimeout(chooseUpgrade, 60);
    }
    checkAchievements();
      }

      const overlapLeft = (ball.x + ball.radius) - rect.x;
      const overlapRight = (rect.x + rect.w) - (ball.x - ball.radius);
      const overlapTop = (ball.y + ball.radius) - rect.y;
      const overlapBottom = (rect.y + rect.h) - (ball.y - ball.radius);
      const minXOverlap = Math.min(overlapLeft, overlapRight);
      const minYOverlap = Math.min(overlapTop, overlapBottom);

      if (minXOverlap < minYOverlap) {
    ball.vx *= -1;
    ball.x += ball.vx > 0 ? dt * Math.abs(ball.vx) : -dt * Math.abs(ball.vx);
      } else {
    ball.vy *= -1;
    ball.y += ball.vy > 0 ? dt * Math.abs(ball.vy) : -dt * Math.abs(ball.vy);
      }
      // Sticky-paddle-upgrade spin on brick
      if (game.stickyBoost > 0) { ball.vx *= (1 + game.stickyBoost * 0.02); ball.vy *= (1 + game.stickyBoost * 0.02); }
      break;
    }
  }

  function updatePaddle(dt) {
    const now = performance.now();

    if (game.widePaddleUntil && now > game.widePaddleUntil) {
      game.widePaddleUntil = 0;
      setPaddleWidth(PADDLE_BASE_WIDTH);
    }

    if (game.slowBallUntil && now > game.slowBallUntil) {
      const restore = 1 / SLOW_BALL_MULTIPLIER;
      for (const ball of game.balls) {
    ball.vx *= restore;
    ball.vy *= restore;
      }
      game.slowBallUntil = 0;
    }

    if (game.bigBallUntil && now > game.bigBallUntil) {
      for (const ball of game.balls) {
    ball.radius = BALL_RADIUS;
      }
      game.bigBallUntil = 0;
    }

    if (game.activePowerup && now > game.activePowerup.until) {
      game.activePowerup = null;
    }

    game.paddle.velocity = (game.paddle.x - (game.paddle.prevX || game.paddle.x)) / (dt || 1/60);
    game.paddle.prevX = game.paddle.x;

    if (input.pointerActive) {
      game.paddle.x = input.pointerX - game.paddle.width / 2;
    }

    if (input.leftHeld) game.paddle.x -= PADDLE_SPEED * dt;
    if (input.rightHeld) game.paddle.x += PADDLE_SPEED * dt;

    clampPaddle();

    if (game.state === GAME_STATES.IDLE && game.balls[0]) {
      game.balls[0].x = game.paddle.x + game.paddle.width / 2;
      game.balls[0].y = game.paddle.y - BALL_RADIUS - 2;
    }
  }

  function updateBalls(dt) {
    const survivors = [];

    for (const ball of game.balls) {
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.x - ball.radius <= 0) {
    ball.x = ball.radius;
    ball.vx = Math.abs(ball.vx);
      } else if (ball.x + ball.radius >= CANVAS_WIDTH) {
    ball.x = CANVAS_WIDTH - ball.radius;
    ball.vx = -Math.abs(ball.vx);
      }

      if (ball.y - ball.radius <= 0) {
    ball.y = ball.radius;
    ball.vy = Math.abs(ball.vy);
      }

      resolvePaddleCollision(ball);
      resolveBrickCollision(ball, dt);

      if (ball.y - ball.radius <= CANVAS_HEIGHT) {
    survivors.push(ball);
      }
    }

    game.balls = survivors;

    if (game.bricksLeft <= 0) {
      beginLevel(game.level + 1);
      return;
    }

    if (game.balls.length === 0 && game.state === GAME_STATES.PLAYING && !isLeaderboardVisible()) {
      game.state = GAME_STATES.DEAD;
      setBest(game.score);
      addCoins(game.runCoins);
      checkAchievements({ gameOver: true });
      updateChips();
      if (window.KriiskoLeaderboard && window.KriiskoLeaderboard.qualifies('breakout', game.score)) {
    window.KriiskoLeaderboard.promptInitials('breakout', game.score, function(initials) {
      if (initials) window.KriiskoLeaderboard.submit('breakout', game.score, initials);
      window.KriiskoLeaderboard.show('breakout');
    });
      }
    }
  }

  function updatePowerups(dt) {
    const active = [];
    const paddleRect = { x: game.paddle.x, y: game.paddle.y, w: game.paddle.width, h: game.paddle.height };

    for (const powerup of game.powerups) {
      powerup.y += powerup.vy * dt;
      const rect = { x: powerup.x, y: powerup.y, w: powerup.w, h: powerup.h };

      const intersects =
    rect.x < paddleRect.x + paddleRect.w &&
    rect.x + rect.w > paddleRect.x &&
    rect.y < paddleRect.y + paddleRect.h &&
    rect.y + rect.h > paddleRect.y;

      if (intersects) {
    applyPowerup(powerup.type);
    continue;
      }

      if (powerup.y <= CANVAS_HEIGHT) {
    active.push(powerup);
      }
    }

    game.powerups = active;
  }

  function updateLaserBullets(dt) {
    const active = [];
    for (const bullet of game.laserBullets) {
      bullet.y += bullet.vy * dt;
      if (bullet.y < 0) continue;

      let hitBrick = false;
      for (const brick of game.bricks) {
    if (!brick.alive) continue;
    if (bullet.x >= brick.x && bullet.x <= brick.x + BRICK_WIDTH &&
        bullet.y >= brick.y && bullet.y <= brick.y + BRICK_HEIGHT) {
      brick.alive = false;
      game.bricksLeft -= 1;
      game.score += BRICK_ROW_POINTS[brick.row];
      syncHud();
      spawnPowerup(brick.x, brick.y, brick.isPowerBrick);
      hitBrick = true;
      break;
    }
      }
      if (!hitBrick) {
    active.push(bullet);
      }
    }
    game.laserBullets = active;

    if (game.bricksLeft <= 0) {
      beginLevel(game.level + 1);
    }
  }

  function updateWinState() {
    if (performance.now() >= game.winFlashUntil) {
      game.state = GAME_STATES.PLAYING;
      setIdleBall();
      startPlayFromIdle();
    }
  }

  function update(dt) {
    updatePaddle(dt);

    if (game.state === GAME_STATES.PLAYING) {
      updateBalls(dt);
      updatePowerups(dt);
      updateLaserBullets(dt);
    } else if (game.state === GAME_STATES.WIN) {
      updateWinState();
    }
  }

  // RENDER
  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function renderBackground() {
    ctx.fillStyle = COLORS.background;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  }

  function renderBricks() {
    for (const brick of game.bricks) {
      if (!brick.alive) continue;
      if (brick.type === 'tough') {
    ctx.fillStyle = brick.hp >= 2 ? '#9e9e9e' : COLORS.brickRows[brick.row];
    drawRoundedRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT, 4);
    ctx.fill();
    ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1.5;
    drawRoundedRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT, 4);
    ctx.stroke();
      } else if (brick.type === 'bomber') {
    ctx.save();
    ctx.shadowColor = '#ff4081'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff4081';
    drawRoundedRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT, 4);
    ctx.fill();
    ctx.restore();
      } else if (brick.isPowerBrick) {
    ctx.save();
    ctx.shadowColor = "#ffc107"; ctx.shadowBlur = 8;
    ctx.fillStyle = "#ffc107";
    drawRoundedRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT, 4);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#fff8e1"; ctx.lineWidth = 1.5;
    drawRoundedRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT, 4);
    ctx.stroke();
      } else {
    ctx.fillStyle = COLORS.brickRows[brick.row];
    drawRoundedRect(brick.x, brick.y, BRICK_WIDTH, BRICK_HEIGHT, 4);
    ctx.fill();
      }
    }
  }

  function renderPaddle() {
    const now = performance.now();
    if (game.laserPaddleUntil > now) {
      ctx.fillStyle = "#ff4444";
    } else if (game.widePaddleUntil > now) {
      ctx.fillStyle = "#00bcd4";
    } else {
      ctx.fillStyle = COLORS.paddle;
    }
    drawRoundedRect(game.paddle.x, game.paddle.y, game.paddle.width, game.paddle.height, 6);
    ctx.fill();
  }

  function renderBalls() {
    const now = performance.now();
    if (game.slowBallUntil > now) {
      ctx.fillStyle = "#ffd54f";
    } else if (game.bigBallUntil > now) {
      ctx.fillStyle = "#ff8800";
    } else {
      ctx.fillStyle = COLORS.ball;
    }
    for (const ball of game.balls) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function renderLaserBullets() {
    ctx.fillStyle = "#ff4444";
    for (const bullet of game.laserBullets) {
      ctx.fillRect(bullet.x - 2, bullet.y - 6, 4, 12);
    }
  }

  function renderPowerups() {
    const pillStyles = {
      wide:  { color: "#3fa9f5", label: "W" },
      multi: { color: "#ffd54f", label: "M" },
      laser: { color: "#ff4444", label: "L" },
      slow:  { color: "#ffeb3b", label: "S" },
      big:   { color: "#ff8800", label: "B" }
    };
    for (const powerup of game.powerups) {
      const style = pillStyles[powerup.type] || pillStyles.wide;
      ctx.fillStyle = style.color;
      drawRoundedRect(powerup.x, powerup.y, powerup.w, powerup.h, powerup.h / 2);
      ctx.fill();
      ctx.fillStyle = "#101014";
      ctx.font = "bold 11px 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(style.label, powerup.x + powerup.w / 2, powerup.y + powerup.h / 2 + 0.4);
    }
  }

  function renderMessage(text) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.42)";
    ctx.fillRect(0, CANVAS_HEIGHT * 0.37, CANVAS_WIDTH, 76);
    ctx.fillStyle = COLORS.text;
    ctx.font = "20px 'Orbitron', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.43);
  }

  function renderPowerupIndicator() {
    if (!game.activePowerup) return;
    const now = performance.now();
    const remaining = Math.max(0, game.activePowerup.until - now);
    const total = game.activePowerup.until - (game.activePowerup.until - remaining) + remaining;

    const barWidth = 100;
    const barHeight = 8;
    const barX = CANVAS_WIDTH - barWidth - 12;
    const barY = 14;

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "bold 11px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.fillText(game.activePowerup.name, barX - 6, barY - 1);

    ctx.fillStyle = "rgba(255,255,255,0.2)";
    drawRoundedRect(barX, barY, barWidth, barHeight, 4);
    ctx.fill();

    const maxDuration = 10_000;
    const ratio = Math.min(remaining / maxDuration, 1);
    if (ratio > 0) {
      ctx.fillStyle = "#4caf50";
      drawRoundedRect(barX, barY, barWidth * ratio, barHeight, 4);
      ctx.fill();
    }
  }

  function render() {
    renderBackground();
    renderBricks();
    renderPowerups();
    renderLaserBullets();
    renderPaddle();
    renderBalls();
    renderPowerupIndicator();

    if (game.state === GAME_STATES.IDLE) {
      renderMessage("Click or press Space to launch");
    } else if (game.state === GAME_STATES.DEAD) {
      renderMessage(`Game Over - Score: ${game.score} - Press Space to restart`);
    } else if (game.state === GAME_STATES.WIN) {
      renderMessage(`Level ${game.level}!`);
    }
  }

  // LOOP
  function resizeCanvasForDpr() {
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_MAX);
    canvas.width = Math.round(CANVAS_WIDTH * dpr);
    canvas.height = Math.round(CANVAS_HEIGHT * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function syncHud() {
    scoreDisplay.textContent = `Score: ${game.score}`;
    levelDisplay.textContent = `Level: ${game.level}`;
  }

  function frame(timeMs) {
    if (KM.isPaused() || game.paused) { game.lastFrameTime = timeMs; return requestAnimationFrame(frame); }
    const dt = Math.min((timeMs - game.lastFrameTime) / 1000, 1 / 30);
    game.lastFrameTime = timeMs;
    update(dt);
    render();
    KM.trackScore(game.score);
    requestAnimationFrame(frame);
  }

  function init() {
    KM.init({
      slug: 'breakout',
      title: 'Breakout',
      tagline: 'Destroy bricks',
      controls: 'Arrow keys or swipe',
      world: 'Arcade',
      difficulty: selectedMode
    });
    resizeCanvasForDpr();
    window.addEventListener("resize", resizeCanvasForDpr);
    updateChips();
    showStartModal();
    beginLevel(1);
    game.lastFrameTime = performance.now();
    requestAnimationFrame(frame);
  }

  init();

  // Debug API — exposed for automated testing (GameTestKit)
  window.__BREAKOUT__ = {
    getScore:        () => game.score,
    getState:        () => game.state,
    getBricksLeft:   () => game.bricksLeft,
    getBallCount:    () => game.balls.length,
    getPaddleX:      () => game.paddle.x,
    getLevel:        () => game.level,
    getUpgrades:     () => game.upgrades.slice(),
    getDifficulty:   () => selectedMode,
    getCoins:        () => getCoins(),
    getAchievements: () => getUnlocked(),
    getBrickTypes:   () => ENEMY_TYPES.map(e => e.name)
  };
    })();
  </script>
</body>
</html>
