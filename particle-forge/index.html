<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Particle Forge</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #020012;
      color: #e0e8ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100dvh;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #game-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }

    canvas#forge-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .ui-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      pointer-events: none;
    }

    .ui-layer > * { pointer-events: auto; }

    .panel {
      background: rgba(0, 0, 20, 0.85);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 200, 255, 0.15), inset 0 0 8px rgba(0, 200, 255, 0.05);
      padding: 12px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ccff;
      text-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(0, 200, 255, 0.2);
      padding-bottom: 6px;
    }

    .mono { font-family: 'Consolas', 'SF Mono', 'Fira Code', monospace; }

    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid rgba(0, 200, 255, 0.4);
      border-radius: 6px;
      background: rgba(0, 40, 80, 0.6);
      color: #e0e8ff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }

    .btn:hover:not(:disabled) {
      background: rgba(0, 80, 160, 0.7);
      border-color: rgba(0, 200, 255, 0.8);
      box-shadow: 0 0 10px rgba(0, 200, 255, 0.3);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-accent {
      border-color: rgba(255, 200, 0, 0.5);
      background: rgba(80, 60, 0, 0.5);
    }

    .btn-accent:hover:not(:disabled) {
      background: rgba(120, 90, 0, 0.7);
      border-color: rgba(255, 200, 0, 0.9);
      box-shadow: 0 0 10px rgba(255, 200, 0, 0.3);
    }

    .btn-prestige {
      border-color: rgba(200, 100, 255, 0.5);
      background: rgba(60, 0, 80, 0.5);
    }

    .btn-prestige:hover:not(:disabled) {
      background: rgba(90, 0, 120, 0.7);
      border-color: rgba(200, 100, 255, 0.9);
      box-shadow: 0 0 14px rgba(200, 100, 255, 0.4);
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 260px;
      max-height: calc(100% - 16px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,200,255,0.3) transparent;
    }

    #shop-panel {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 260px;
      max-height: calc(100% - 16px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,200,255,0.3) transparent;
    }

    #accelerate-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 54px;
      border-radius: 27px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 2px solid rgba(0, 255, 200, 0.6);
      background: rgba(0, 80, 60, 0.7);
      color: #00ffc8;
      text-shadow: 0 0 10px rgba(0, 255, 200, 0.7);
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
      cursor: pointer;
      transition: all 0.15s;
      z-index: 10;
    }

    #accelerate-btn:hover {
      background: rgba(0, 120, 90, 0.8);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.4);
    }

    #accelerate-btn:active {
      transform: translateX(-50%) scale(0.94);
    }

    .overlay-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 90vw);
      max-height: 80vh;
      overflow-y: auto;
      z-index: 100;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,200,255,0.3) transparent;
    }

    .overlay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 10, 0.7);
      z-index: 99;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover { color: #fff; }

    .element-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 13px;
    }

    .element-orb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .shop-item { margin-bottom: 6px; }
    .shop-item .cost { color: #ffcc00; font-size: 11px; }
    .shop-item .desc { color: #8899bb; font-size: 11px; }

    .research-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .research-branch { margin-bottom: 12px; }

    .research-branch-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #aaccff;
    }

    .research-item {
      margin-bottom: 4px;
    }

    .research-item .btn {
      font-size: 11px;
      padding: 6px 8px;
    }

    .notification {
      position: absolute;
      pointer-events: none;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 0 8px currentColor;
      white-space: nowrap;
      z-index: 50;
      transition: none;
    }

    .offline-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      text-align: center;
      padding: 24px;
      animation: fadeOut 3s 2s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; pointer-events: none; }
    }

    @media (max-width: 700px) {
      #hud { width: 160px; font-size: 11px; }
      #shop-panel { width: 160px; font-size: 11px; }
      #accelerate-btn { width: 140px; height: 46px; font-size: 13px; bottom: 12px; }
      .overlay-panel { width: 95vw; }
      .panel { padding: 8px; }
      .panel-title { font-size: 12px; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-D27fWTva.js"></script>
</head>
<body data-mobile-controls="click">
  <div id="game-root">
    <canvas id="forge-canvas"></canvas>
    <div class="ui-layer">
      <div id="hud" class="panel"></div>
      <div id="shop-panel" class="panel"></div>
      <button id="accelerate-btn">Accelerate</button>
    </div>
  </div>
  <script src="../shared/leaderboard.js"></script>
  <script src="../shared/mobile-controls.js"></script>
</body>
</html>
