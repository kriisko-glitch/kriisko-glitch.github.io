<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Defense</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d1a;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    #game-root {
      width: 800px;
      max-width: 100vw;
    }

    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body data-mobile-controls="click">
  <div id="game-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script src="../shared/kriisko-juice.js"></script>
  <script src="../shared/kriisko-meta.js"></script>
  <script>
    if (window.KM) {
      window.KM.init({
        slug: 'tower-defense',
        title: 'Tower Defense',
        tagline: 'Build towers. Survive waves. Protect the exit.',
        controls: 'Click a buildable cell, pick a tower. Click NEXT WAVE to start. P to pause.',
        world: 'A winding path. 5+ waves of runners, tanks, and healers.'
      });
    }
  </script>
  <script src="../shared/leaderboard.js"></script>
  <script type="module" src="./game.js"></script>
  <script src="../shared/mobile-controls.js"></script>
  <div id="km-difficulty" style="position:fixed;top:50px;right:14px;z-index:40;display:flex;gap:4px;font-size:11px;font-family:monospace;">
    <button class="km-diff" data-diff="easy" style="padding:2px 8px;cursor:pointer;">Easy</button>
    <button class="km-diff km-active" data-diff="normal" style="padding:2px 8px;cursor:pointer;background:#0ff;color:#000;">Normal</button>
    <button class="km-diff" data-diff="hard" style="padding:2px 8px;cursor:pointer;">Hard</button>
  </div>
  <script>
    (function(){
      try { var saved = localStorage.getItem('kriisko:difficulty') || 'normal';
        document.querySelectorAll('.km-diff').forEach(function(b){ b.classList.toggle('km-active', b.dataset.diff === saved); });
      } catch(_){}
      document.querySelectorAll('.km-diff').forEach(function(b){
        b.addEventListener('click', function(e){
          document.querySelectorAll('.km-diff').forEach(function(x){ x.classList.remove('km-active'); x.style.background=''; x.style.color=''; });
          e.target.classList.add('km-active');
          e.target.style.background='#0ff'; e.target.style.color='#000';
          try { localStorage.setItem('kriisko:difficulty', e.target.dataset.diff); } catch(_){}
        });
      });
    })();
  </script>
</body>
</html>
