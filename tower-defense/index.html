<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Defense</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d1a;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    #game-root {
      width: 800px;
      max-width: 100vw;
    }

    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body data-mobile-controls="joystick">
  <div id="game-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script type="module" src="./game.js"></script>
  <script src="../shared/mobile-controls.js"></script>
</body>
</html>
