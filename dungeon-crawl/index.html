<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dungeon Crawl</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #070911;
      overflow: hidden;
      font-family: "Trebuchet MS", Verdana, sans-serif;
    }

    #game-root {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>
<body data-mobile-controls="dpad">
  <div id="game-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script src="scenes/BootScene.js"></script>
  <script src="scenes/GameScene.js"></script>
  <script src="scenes/HUDScene.js"></script>
  <script src="scenes/GameOverScene.js"></script>
  <script src="game.js"></script>
  <script src="../shared/mobile-controls.js"></script>
</body>
</html>
