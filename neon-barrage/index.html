<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Barrage</title>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;font-family:'Orbitron',monospace}
canvas{display:block;background:#0a0a0a}
#difficulty-select,#perk-tree,#upgrade-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;z-index:100;color:#0ff;text-align:center;padding-top:80px}
#difficulty-select.show,#perk-tree.show,#upgrade-modal.show{display:block}
.btn-diff,.btn-perk,.btn-upg{background:#022;border:2px solid #0ff;color:#0ff;padding:16px 32px;margin:10px;font-size:18px;cursor:pointer;font-family:Orbitron}
.btn-diff:hover,.btn-perk:hover,.btn-upg:hover{background:#055}
.btn-perk.owned{border-color:#ff0;color:#ff0}
#toast{position:fixed;top:60px;right:20px;background:#022;border:2px solid #ff0;color:#ff0;padding:12px 20px;z-index:200;display:none;max-width:280px;font-family:Orbitron}
#toast.show{display:block;animation:slideIn 0.3s}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c" aria-label="Game canvas"></canvas>
<div id="difficulty-select">
  <h1 style="font-size:48px">NEON BARRAGE</h1>
  <p>Select Difficulty</p>
  <button class="btn-diff" data-diff="easy">EASY</button>
  <button class="btn-diff" data-diff="normal">NORMAL</button>
  <button class="btn-diff" data-diff="hard">HARD</button>
  <br><br>
  <button class="btn-perk" id="open-perks">PERK TREE</button>
  <p id="coins-display" style="margin-top:20px">Coins: 0</p>
  <p style="font-size:14px;opacity:0.7">Arrows/WASD move, SPACE/Click shoot, Q/E weapon, B bomb</p>
</div>
<div id="perk-tree">
  <h1>PERK TREE</h1>
  <p id="perk-coins">Coins: 0</p>
  <div id="perk-list"></div>
  <button class="btn-perk" id="close-perks">BACK</button>
</div>
<div id="upgrade-modal">
  <h1>CHOOSE UPGRADE</h1>
  <div id="upgrade-choices"></div>
</div>
<div id="toast"></div>
<script src="../shared/kriisko-juice.js"></script>
<script src="../shared/kriisko-meta.js"></script>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}
resize();window.addEventListener('resize',resize);
const keys={},mouse={x:c.width/2,y:c.height/2,down:false};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
window.addEventListener('mousedown',()=>mouse.down=true);
window.addEventListener('mouseup',()=>mouse.down=false);

const PI=Math.PI,TAU=PI*2;
const STATE_MENU=0,STATE_PLAY=1,STATE_GAMEOVER=2,STATE_UPGRADE=3;
let state=STATE_MENU,score=0,high=localStorage.getItem('nb_high')||0,wave=1,lives=3,bombs=3,graze=0,multiplier=1;
let player,enemies=[],bullets=[],particles=[],powerups=[],stars=[],shake=0,lastShot=0;
let weaponIndex=0,difficulty='normal',nextUpgradeWave=5,upgrades=[];
let coins=parseInt(localStorage.getItem('nb_coins')||'0');
let perks=JSON.parse(localStorage.getItem('nb_perks')||'{}');
let achievements=JSON.parse(localStorage.getItem('nb_achievements')||'{}');

const diffMult={easy:{hp:0.7,rate:0.8,score:0.8},normal:{hp:1,rate:1,score:1},hard:{hp:1.4,rate:1.4,score:1.3}};

spawnStars();

KM.init({
  slug: 'neon-barrage',
  title: 'Neon Barrage',
  tagline: 'SHMUP • Arrows/WASD to move • SPACE/Click to shoot • Q/E weapons • B bomb',
  controls: 'keyboard,pointer'
});

// WEAPON_TYPES — 3 weapons (Q/E cycle)
const WEAPON_TYPES=[
  {name:'Machine Gun',cooldown:100,shots:1,spread:0,speed:10,damage:1,color:'#0ff'},
  {name:'Spread Shot',cooldown:180,shots:5,spread:0.18,speed:8,damage:1,color:'#f0f'},
  {name:'Missile',cooldown:400,shots:1,spread:0,speed:7,damage:3,color:'#ff0',homing:true}
];

// UPGRADE_POOL — 7 upgrades, 3-choice modal every 5 waves
const UPGRADE_POOL=[
  {id:'firerate',name:'Rapid Fire',desc:'+25% fire rate',apply:()=>{player.fireRateMult*=1.25;}},
  {id:'damage',name:'Heavy Rounds',desc:'+1 damage',apply:()=>{player.damageBonus++;}},
  {id:'shield',name:'Shield',desc:'+300f shield',apply:()=>{player.shield=Math.max(player.shield,300);}},
  {id:'extrabomb',name:'Extra Bomb',desc:'+2 bombs',apply:()=>{bombs+=2;}},
  {id:'speed',name:'Thrust Tune',desc:'+1 speed',apply:()=>{player.speed+=1;}},
  {id:'multi',name:'Multi-Shot',desc:'+1 bullet per shot',apply:()=>{player.extraShots++;}},
  {id:'grazemult',name:'Graze Master',desc:'Graze mult stacks faster',apply:()=>{player.grazeBoost=true;}}
];

// PERK_POOL — 5 meta perks
const PERK_POOL=[
  {id:'start_life',name:'Extra Life',cost:100,desc:'+1 starting life'},
  {id:'start_bomb',name:'Bomb Cache',cost:150,desc:'+2 starting bombs'},
  {id:'coin_boost',name:'Coin Magnet',cost:200,desc:'+50% coin drops'},
  {id:'start_weap',name:'Spread Start',cost:250,desc:'Start with spread shot'},
  {id:'auto_shield',name:'Aegis Core',cost:400,desc:'Start with shield'}
];

// ACHIEVEMENTS — 8 total
const ACHIEVEMENTS=[
  {id:'first_kill',name:'First Blood',cond:()=>score>=100},
  {id:'wave5',name:'Wave 5',cond:()=>wave>=5},
  {id:'wave10',name:'Veteran',cond:()=>wave>=10},
  {id:'score5k',name:'Sharpshooter',cond:()=>score>=5000},
  {id:'score20k',name:'Ace Pilot',cond:()=>score>=20000},
  {id:'graze100',name:'Brave',cond:()=>graze>=100},
  {id:'all_weapons',name:'Arsenal',cond:()=>player&&player.weaponsUsed&&player.weaponsUsed.size>=3},
  {id:'upgrades5',name:'Powered Up',cond:()=>upgrades.length>=5}
];

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!achievements[a.id]&&a.cond()){
      achievements[a.id]=true;
      localStorage.setItem('nb_achievements',JSON.stringify(achievements));
      showToast('Achievement: '+a.name);
    }
  });
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

class Vec{constructor(x=0,y=0){this.x=x;this.y=y;}}
class Player extends Vec{
    constructor(){
        super(c.width/2,c.height-80);
        this.r=12;this.speed=5;this.power=1;
        this.shield=perks.auto_shield?600:0;
        this.hitbox=3;this.fireRateMult=1;this.damageBonus=0;this.extraShots=0;
        this.grazeBoost=false;
        this.weaponsUsed=new Set();
    }
    update(){
        if(keys['ArrowLeft']||keys['a']||keys['A'])this.x-=this.speed;
        if(keys['ArrowRight']||keys['d']||keys['D'])this.x+=this.speed;
        if(keys['ArrowUp']||keys['w']||keys['W'])this.y-=this.speed;
        if(keys['ArrowDown']||keys['s']||keys['S'])this.y+=this.speed;
        this.x=Math.max(this.r,Math.min(c.width-this.r,this.x));
        this.y=Math.max(this.r,Math.min(c.height-this.r,this.y));
        if(this.shield>0)this.shield--;
        if(keys['q']&&!this._qLock){weaponIndex=(weaponIndex-1+WEAPON_TYPES.length)%WEAPON_TYPES.length;this._qLock=true;this.weaponsUsed.add(weaponIndex);}
        if(!keys['q'])this._qLock=false;
        if(keys['e']&&!this._eLock){weaponIndex=(weaponIndex+1)%WEAPON_TYPES.length;this._eLock=true;this.weaponsUsed.add(weaponIndex);}
        if(!keys['e'])this._eLock=false;
    }
    draw(){
        ctx.save();
        if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);}
        ctx.fillStyle=WEAPON_TYPES[weaponIndex].color;ctx.shadowColor=WEAPON_TYPES[weaponIndex].color;ctx.shadowBlur=15;
        ctx.beginPath();ctx.moveTo(this.x,this.y-this.r);ctx.lineTo(this.x-this.r,this.y+this.r);ctx.lineTo(this.x+this.r,this.y+this.r);ctx.closePath();ctx.fill();
        ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.fillRect(this.x-1,this.y-1,2,2);
        if(this.shield>0){ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.globalAlpha=0.5+Math.sin(Date.now()/100)*0.3;ctx.beginPath();ctx.arc(this.x,this.y,this.r+8,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
        ctx.restore();
    }
}

// ENEMY_TYPES — 4 distinct enemy classes
class Enemy extends Vec{
    constructor(x,y){super(x,y);this.r=18;this.hp=3;this.maxHp=3;this.ang=0;this.timer=0;this.pattern=0;this.name='Basic';this.color='#a0f';}
    update(){this.timer++;this.y+=1.5;if(this.timer%40===0)this.fire();}
    fire(){bullets.push(new Bullet(this.x,this.y,3,PI/2+Math.random()*0.4-0.2,'enemy'));}
    draw(){
        ctx.save();ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=20;
        ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.fill();ctx.restore();
    }
}
class EnemyScout extends Enemy{
    constructor(x,y){super(x,y);this.r=12;this.hp=1;this.maxHp=1;this.name='Scout';this.color='#f80';this.zig=Math.random()*TAU;}
    update(){this.timer++;this.y+=2.5;this.x+=Math.sin(this.timer/15+this.zig)*2;
      if(this.timer%60===0)this.fire();}
    fire(){bullets.push(new Bullet(this.x,this.y,4,PI/2,'enemy'));}
}
class EnemyGunner extends Enemy{
    constructor(x,y){super(x,y);this.r=18;this.hp=4;this.maxHp=4;this.name='Gunner';this.color='#a0f';}
    update(){this.timer++;if(this.y<120)this.y+=1.2;
      if(this.timer%50===0){for(let i=-1;i<=1;i++)bullets.push(new Bullet(this.x,this.y,3,PI/2+i*0.25,'enemy'));}}
}
class EnemyBrute extends Enemy{
    constructor(x,y){super(x,y);this.r=26;this.hp=8;this.maxHp=8;this.name='Brute';this.color='#f0f';}
    update(){this.timer++;this.y+=0.8;
      if(this.timer%70===0){for(let i=0;i<10;i++)bullets.push(new Bullet(this.x,this.y,2,TAU/10*i+this.timer/40,'enemy'));}}
}
class EnemyBoss extends Enemy{
    constructor(x,y){super(x,y);this.r=40;this.hp=50;this.maxHp=50;this.name='Boss';this.color='#f00';}
    update(){this.timer++;this.x=c.width/2+Math.sin(this.timer/60)*150;this.y=80;
      if(this.timer%40===0)this.bossPattern();}
    bossPattern(){
        const p=this.pattern%4;
        if(p===0){for(let i=0;i<12;i++)bullets.push(new Bullet(this.x,this.y,3,PI/6*i+this.timer/100,'enemy'));}
        if(p===1){for(let i=0;i<8;i++)bullets.push(new Bullet(this.x,this.y,2.5,PI/4*i,'enemy'));}
        if(p===2){for(let i=0;i<20;i++)bullets.push(new Bullet(this.x,this.y,2,TAU/20*i+this.timer/50,'enemy'));}
        if(p===3){for(let i=0;i<5;i++)bullets.push(new Bullet(this.x,this.y,4,PI/2+this.timer/60+i*0.2,'enemy'));}
        this.pattern++;
    }
    draw(){super.draw();
      ctx.fillStyle='#f0f';ctx.fillRect(this.x-60,this.y-50,120*this.hp/this.maxHp,6);}
}

const ENEMY_TYPES=[
  {cls:EnemyScout,weight:5,minWave:1},
  {cls:Enemy,weight:3,minWave:1},
  {cls:EnemyGunner,weight:2,minWave:2},
  {cls:EnemyBrute,weight:1,minWave:4}
];

function spawnOne(){
  const pool=ENEMY_TYPES.filter(t=>t.minWave<=wave);
  const total=pool.reduce((s,t)=>s+t.weight,0);
  let r=Math.random()*total;
  for(const t of pool){r-=t.weight;if(r<=0){enemies.push(new t.cls(50+Math.random()*(c.width-100),50));return;}}
}

class Bullet extends Vec{
    constructor(x,y,spd,ang,owner='player',damage,color,homing){
        super(x,y);
        this.vx=Math.cos(ang)*spd;this.vy=Math.sin(ang)*spd;
        this.r=owner==='player'?4:6;this.owner=owner;
        this.damage=damage||1;this.color=color||(owner==='player'?'#0ff':'#f80');
        this.homing=homing||false;
    }
    update(){
        if(this.homing&&this.owner==='player'&&enemies.length){
          let nearest=enemies[0],nd=Math.hypot(this.x-nearest.x,this.y-nearest.y);
          for(const e of enemies){const d=Math.hypot(this.x-e.x,this.y-e.y);if(d<nd){nd=d;nearest=e;}}
          const ta=Math.atan2(nearest.y-this.y,nearest.x-this.x);
          const cs=Math.hypot(this.vx,this.vy);
          this.vx=this.vx*0.92+Math.cos(ta)*cs*0.08;
          this.vy=this.vy*0.92+Math.sin(ta)*cs*0.08;
        }
        this.x+=this.vx;this.y+=this.vy;
    }
    draw(){
        ctx.save();ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=10;
        ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.fill();ctx.restore();
    }
}
class Particle extends Vec{
    constructor(x,y,col='#0ff'){super(x,y);
        this.vx=(Math.random()-0.5)*6;this.vy=(Math.random()-0.5)*6;this.life=30;this.col=col;this.r=Math.random()*3+1;}
    update(){this.x+=this.vx;this.y+=this.vy;this.life--;}
    draw(){ctx.save();ctx.globalAlpha=this.life/30;ctx.fillStyle=this.col;ctx.shadowColor=this.col;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.fill();ctx.restore();}
}
class Powerup extends Vec{
    constructor(x,y){super(x,y);this.type=['spread','laser','shield','speed','coin'][Math.floor(Math.random()*5)];this.vy=2;this.r=14;}
    update(){this.y+=this.vy;}
    draw(){ctx.save();ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=15;
        ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.fill();
        ctx.fillStyle='#000';ctx.font='12px monospace';ctx.fillText(this.type[0].toUpperCase(),this.x-6,this.y+4);ctx.restore();}
}

function spawnWave(){
    enemies=[];
    if(wave%5===0)enemies.push(new EnemyBoss(c.width/2,80));
    else{const count=5+wave*2;for(let i=0;i<count;i++)spawnOne();}
}
function spawnStars(){stars=[];for(let i=0;i<100;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,s:Math.random()*2});}
function addScore(s){const gain=Math.floor(s*multiplier*diffMult[difficulty].score);score+=gain;
  const cg=Math.floor(gain/20*(perks.coin_boost?1.5:1));coins+=cg;localStorage.setItem('nb_coins',coins);
  KM.trackScore(score);}
function explode(x,y,col,count=20){for(let i=0;i<count;i++)particles.push(new Particle(x,y,col));shake=8;KJ.shake(6, 150);}

function updatePlayer(){
    player.update();
    if(keys[' ']||mouse.down){
      const w=WEAPON_TYPES[weaponIndex];
      if(Date.now()-lastShot>w.cooldown/player.fireRateMult){
        playerFire();lastShot=Date.now();
      }
    }
    if(keys['b']||keys['B']){if(bombs>0){bombs--;bullets=bullets.filter(b=>b.owner!=='enemy');explode(player.x,player.y,'#0ff',40);
      enemies.forEach(e=>{e.hp-=3;});}}
}
function playerFire(){
    const ang=-PI/2;
    const w=WEAPON_TYPES[weaponIndex];
    const shotCount=w.shots+player.extraShots;
    for(let i=0;i<shotCount;i++){
      const off=shotCount>1?(i-(shotCount-1)/2)*(w.spread||0.08):0;
      bullets.push(new Bullet(player.x,player.y-12,w.speed,ang+off,'player',w.damage+player.damageBonus,w.color,w.homing));
    }
    KJ.shoot();
}

function updateEnemies(){
    enemies.forEach((e,ei)=>{
        e.update();
        if(e.y>c.height+50)enemies.splice(ei,1);
        if(e.hp<=0){
            explode(e.x,e.y,e.color,30);
            const pts=e.name==='Boss'?1000:e.name==='Brute'?300:e.name==='Gunner'?150:100;
            addScore(pts);
            if(Math.random()<0.2)powerups.push(new Powerup(e.x,e.y));
            enemies.splice(ei,1);KJ.hit();
        }
    });
    if(enemies.length===0){wave++;
      if(wave>=nextUpgradeWave){nextUpgradeWave+=5;showUpgradeModal();}
      else spawnWave();}
}
function updateBullets(){
    bullets.forEach((b,bi)=>{
        b.update();
        if(b.x<0||b.x>c.width||b.y<0||b.y>c.height){bullets.splice(bi,1);return;}
        if(b.owner==='player'){
            enemies.forEach(e=>{
                if(Math.hypot(b.x-e.x,b.y-e.y)<e.r){e.hp-=b.damage;bullets.splice(bi,1);KJ.hit();}
            });
        }else{
            const d=Math.hypot(b.x-player.x,b.y-player.y);
            if(d<player.r+8&&d>player.hitbox){graze++;
              const step=player.grazeBoost?5:10;
              if(graze%step===0)multiplier=Math.min(multiplier+0.1,3);KJ.pickup();}
            if(d<player.hitbox){
                if(player.shield>0){player.shield=0;bullets.splice(bi,1);explode(player.x,player.y,'#0ff',10);KJ.flash('#fff',70);}
                else{takeDamage();}
            }
        }
        if(bullets[bi]===b)bullets.splice(bi,1);
    });
}
function updatePowerups(){
    powerups.forEach((p,pi)=>{
        p.update();
        if(Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r){
            if(p.type==='spread')weaponIndex=1;
            if(p.type==='laser'){weaponIndex=2;}
            if(p.type==='shield')player.shield=Math.max(player.shield,300);
            if(p.type==='speed')player.speed=Math.min(10,player.speed+1);
            if(p.type==='coin'){coins+=20;localStorage.setItem('nb_coins',coins);}
            powerups.splice(pi,1);KJ.pickup();
        }
        if(p.y>c.height+50)powerups.splice(pi,1);
    });
}
function updateParticles(){particles.forEach((p,pi)=>{p.update();if(p.life<=0)particles.splice(pi,1);});}

function takeDamage(){
    lives--;bombs=3;explode(player.x,player.y,'#f00',50);
    if(lives<=0){state=STATE_GAMEOVER;if(score>high){high=score;localStorage.setItem('nb_high',high);}
      KM.gameOver(score,{cause:'loss',onRetry:()=>{document.getElementById('difficulty-select').classList.add('show');updateCoinsDisplay();state=STATE_MENU;}});}
    player.x=c.width/2;player.y=c.height-80;
}

function showUpgradeModal(){
  state=STATE_UPGRADE;
  const choices=[...UPGRADE_POOL].sort(()=>Math.random()-0.5).slice(0,3);
  const cont=document.getElementById('upgrade-choices');
  cont.innerHTML='';
  choices.forEach(u=>{
    const b=document.createElement('button');
    b.className='btn-upg';b.innerHTML='<b>'+u.name+'</b><br>'+u.desc;
    b.onclick=()=>{u.apply();upgrades.push(u.id);document.getElementById('upgrade-modal').classList.remove('show');state=STATE_PLAY;spawnWave();checkAchievements();};
    cont.appendChild(b);
  });
  document.getElementById('upgrade-modal').classList.add('show');
}

function draw(){
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,c.width,c.height);
    stars.forEach(s=>{ctx.fillStyle='#444';ctx.fillRect(s.x,s.y,s.s,s.s);});
    if(state===STATE_PLAY||state===STATE_UPGRADE){
        player.draw();
        enemies.forEach(e=>e.draw());
        bullets.forEach(b=>b.draw());
        powerups.forEach(p=>p.draw());
        particles.forEach(p=>p.draw());
        ctx.fillStyle='#0ff';ctx.font='16px Orbitron';
        ctx.fillText('Score: '+score,20,30);
        ctx.fillText('Wave: '+wave,20,50);
        ctx.fillText('Lives: '+lives,20,70);
        ctx.fillText('Bombs: '+bombs,20,90);
        ctx.fillText('x'+multiplier.toFixed(1),20,110);
        ctx.fillText('Graze: '+graze,20,130);
        ctx.fillText('Weapon: '+WEAPON_TYPES[weaponIndex].name,20,150);
        ctx.fillText('Diff: '+difficulty.toUpperCase(),20,170);
        ctx.fillStyle='#ff0';ctx.fillText('Coins: '+coins,20,190);
        ctx.fillStyle='#0ff';ctx.fillText('Upgrades: '+upgrades.length,20,210);
    }
    if(shake>0)shake--;
}

function startGame(){
    state=STATE_PLAY;score=0;wave=1;graze=0;multiplier=1;nextUpgradeWave=5;upgrades=[];
    lives=3+(perks.start_life?1:0);
    bombs=3+(perks.start_bomb?2:0);
    weaponIndex=perks.start_weap?1:0;
    player=new Player();enemies=[];bullets=[];particles=[];powerups=[];
    spawnWave();spawnStars();
}

function updateCoinsDisplay(){
  document.getElementById('coins-display').textContent='Coins: '+coins;
  document.getElementById('perk-coins').textContent='Coins: '+coins;
}

function buildPerkTree(){
  const list=document.getElementById('perk-list');
  list.innerHTML='';
  PERK_POOL.forEach(p=>{
    const owned=perks[p.id];
    const affordable=coins>=p.cost;
    const b=document.createElement('button');
    b.className='btn-perk'+(owned?' owned':'');
    b.innerHTML='<b>'+p.name+'</b> ('+p.cost+')<br>'+p.desc;
    if(owned)b.innerHTML+='<br>OWNED';
    b.onclick=()=>{if(!owned&&affordable){coins-=p.cost;perks[p.id]=true;
      localStorage.setItem('nb_coins',coins);localStorage.setItem('nb_perks',JSON.stringify(perks));
      buildPerkTree();updateCoinsDisplay();}};
    list.appendChild(b);
  });
}

document.querySelectorAll('.btn-diff').forEach(b=>{
  b.onclick=()=>{difficulty=b.dataset.diff;document.getElementById('difficulty-select').classList.remove('show');startGame();};
});
document.getElementById('open-perks').onclick=()=>{buildPerkTree();document.getElementById('difficulty-select').classList.remove('show');document.getElementById('perk-tree').classList.add('show');};
document.getElementById('close-perks').onclick=()=>{document.getElementById('perk-tree').classList.remove('show');document.getElementById('difficulty-select').classList.add('show');};

function loop(){
    if(state===STATE_PLAY&&!KM.isPaused()){
        updatePlayer();
        updateEnemies();
        updateBullets();
        updatePowerups();
        updateParticles();
        checkAchievements();
    }
    draw();
    requestAnimationFrame(loop);
}
document.getElementById('difficulty-select').classList.add('show');
updateCoinsDisplay();
loop();

window.__NEON_BARRAGE__={
  getScore:()=>score,
  getState:()=>['menu','playing','gameover','upgrade'][state],
  getWave:()=>wave,
  getCoins:()=>coins,
  getUpgrades:()=>upgrades.slice()
};
</script>
</body>
</html>
