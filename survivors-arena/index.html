<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Survivors Arena</title>
  <style>
    :root {
      --bg: #05050b;
      --accent: #e94560;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #ffffff;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game-root {
      max-width: 100vw;
      max-height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body data-mobile-controls="joystick">
  <div id="game-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script src="../shared/leaderboard.js"></script>
  <script src="scenes/BootScene.js"></script>
  <script src="scenes/GameScene.js"></script>
  <script src="scenes/HUDScene.js"></script>
  <script src="scenes/GameOverScene.js"></script>
  <script src="game.js"></script>
  <script src="../shared/mobile-controls.js"></script>
</body>
</html>
