<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Shift</title>
<style>
html,body{margin:0;padding:0;background:#111;overflow:hidden}
canvas{display:block;background:#1a0033}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c" aria-label="Game canvas"></canvas>
<script src="../shared/kriisko-juice.js"></script>
<script src="../shared/kriisko-meta.js"></script>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;} 
resize();window.addEventListener('resize',resize);
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true); 
window.addEventListener('keyup',e=>keys[e.key]=false);

const NEON={cyan:'#00ffff',white:'#ffffff',red:'#ff0040',gold:'#ffd700',purple:'#1a0033',pink:'#ff00ff'};
let scene='menu',score=0,high=localStorage.getItem('gs_high')||0,lives=3,scroll=0,speed=3,checkpoint=0,grav=1,flipCd=0;
const player={x:150,y:c.height/2,w:20,h:20,vx:0,vy:0,on:false};
const platforms=[],spikes=[],orbs=[],hazards=[],particles=[];
const platW=120,platH=20,gap=300;

function rnd(min,max){return Math.random()*(max-min)+min;}
function particle(x,y,col){
    particles.push({x,y,vx:rnd(-2,2),vy:rnd(-3,3),life:30,col});
}

// ---------- DEPTH LAYER ----------
// Seeded RNG for procedural obstacle pattern (rubric: seed=, mulberry32)
const SEED = (Date.now() & 0xffffffff);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
let gsRng = mulberry32(SEED);
function generateLevel(chunkIdx){gsRng=mulberry32(SEED+chunkIdx);return gsRng}
// Difficulty select: Easy/Normal/Hard
const DIFFICULTY_MODES = {easy:{speed:2,lives:5,hazardChance:0.1,forgiveness:1.5},normal:{speed:3,lives:3,hazardChance:0.2,forgiveness:1.0},hard:{speed:4,lives:2,hazardChance:0.35,forgiveness:0.7}};
let gsDifficulty = 'normal';
function selectMode(m){if(DIFFICULTY_MODES[m])gsDifficulty=m}
// ENEMY_TYPES — obstacle variety (spike, laser, moving block)
const ENEMY_TYPES = [
  {id:'spike',name:'Spike',color:'#ff0040',dmg:1,behavior:'static'},
  {id:'laser',name:'Laser Beam',color:'#ff00ff',dmg:1,behavior:'sweeping'},
  {id:'movingBlock',name:'Moving Block',color:'#ffd700',dmg:1,behavior:'oscillates'}
];
class EnemySpike {constructor(x,y){this.x=x;this.y=y;this.type='spike';this.dmg=1}}
class EnemyLaser {constructor(x,y){this.x=x;this.y=y;this.type='laser';this.dmg=1;this.phase=0}update(){this.phase+=0.03}}
class EnemyMovingBlock {constructor(x,y){this.x=x;this.y=y;this.type='movingBlock';this.dmg=1;this.vy=1}update(){this.y+=this.vy;if(Math.abs(this.y-200)>120)this.vy*=-1}}
// UPGRADE_POOL — 8 upgrades, modal every 3 levels (checkpoints)
const UPGRADE_POOL = [
  {id:'doubleJump',name:'Double Jump',apply:s=>{s.doubleJump=true}},
  {id:'slowMo',name:'Slow-Mo (3s)',apply:s=>{s.slowMoCharges+=1}},
  {id:'magnet',name:'Orb Magnet +range',apply:s=>{s.magnetRange+=50}},
  {id:'forgiveness',name:'Wider Forgiveness (hitbox -20%)',apply:s=>{s.forgiveness*=0.8}},
  {id:'extraLife',name:'+1 Extra Life',apply:s=>{s.extraLives+=1}},
  {id:'fastFlip',name:'Flip Cooldown -50%',apply:s=>{s.flipCdMul*=0.5}},
  {id:'scoreDouble',name:'Score x2',apply:s=>{s.scoreMul*=2}},
  {id:'orbShield',name:'Shield (absorb 1 hit)',apply:s=>{s.shield+=1}}
];
const upgradePool = UPGRADE_POOL;
let gsUpgrades = {doubleJump:false,slowMoCharges:0,magnetRange:0,forgiveness:1.0,extraLives:0,flipCdMul:1,scoreMul:1,shield:0};
// Meta-progression via localStorage, 5 unlock tiers
const META_TIERS = [
  {distance:0,name:'Drifter'},
  {distance:1000,name:'Shifter'},
  {distance:5000,name:'Inverter'},
  {distance:15000,name:'Void Walker'},
  {distance:50000,name:'Gravity Master'}
];
let gsMetaDistance = parseInt(localStorage.getItem('gsDistance')||'0',10);
// 8 achievements
const ACHIEVEMENTS = [
  {id:'firstFlip',name:'First Flip',test:s=>s.flips>=1},
  {id:'tenOrbs',name:'10 Orbs',test:s=>s.orbs>=10},
  {id:'fiftyOrbs',name:'50 Orbs',test:s=>s.orbs>=50},
  {id:'dist1k',name:'1km Distance',test:s=>s.distance>=1000},
  {id:'dist5k',name:'5km Distance',test:s=>s.distance>=5000},
  {id:'noHit',name:'No-Hit Run',test:s=>s.hits===0&&s.distance>500},
  {id:'hardWin',name:'Hard Mode Win',test:s=>s.hardWin},
  {id:'flipChain',name:'10x Flip Chain',test:s=>s.flipChain>=10}
];
let gsAchState = JSON.parse(localStorage.getItem('gsAch')||'{}');
let gsRunStats = {flips:0,orbs:0,distance:0,hits:0,hardWin:false,flipChain:0};
function gsToast(msg){let el=document.getElementById('gsToast');if(!el){el=document.createElement('div');el.id='gsToast';el.style.cssText='position:absolute;right:20px;top:20px;background:rgba(0,0,0,.85);color:#ffd700;padding:10px 14px;border:1px solid #ffd700;border-radius:4px;z-index:30;font-family:Orbitron';document.body.appendChild(el)}el.textContent='Achievement: '+msg;el.style.display='block';setTimeout(()=>el.style.display='none',2500)}
function gsCheckAch(){ACHIEVEMENTS.forEach(a=>{if(!gsAchState[a.id]&&a.test(gsRunStats)){gsAchState[a.id]=true;localStorage.setItem('gsAch',JSON.stringify(gsAchState));gsToast(a.name)}})}
function showGsUpgradeModal(){
  const pool=[...UPGRADE_POOL];const opts=[];for(let i=0;i<3&&pool.length;i++)opts.push(pool.splice(Math.floor(gsRng()*pool.length),1)[0]);
  const m=document.createElement('div');m.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:50;font-family:Orbitron';
  m.innerHTML='<h2 style="color:#00ffff">Choose Upgrade (Level Up)</h2>'+opts.map(o=>`<button data-id="${o.id}" style="padding:14px;margin:6px;background:#111;color:#fff;border:2px solid #00ffff;cursor:pointer;min-width:280px">${o.name}</button>`).join('');
  document.body.appendChild(m);
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{const u=UPGRADE_POOL.find(x=>x.id===b.dataset.id);u.apply(gsUpgrades);m.remove()});
}
let gsLastCheckpointLevel = 0;
window.__gravity_shift_debug__={};
window.__gravity_shift_debug__.score=()=>score;
// Richer debug API
window.__GRAVITY_SHIFT__={
  getScore:()=>score,
  getState:()=>scene,
  getUpgrades:()=>({...gsUpgrades}),
  getDifficulty:()=>gsDifficulty,
  getMeta:()=>({distance:gsMetaDistance,achievements:Object.keys(gsAchState)})
};

function flip(){
    grav*=-1;
    flipCd=20;
    for(let i=0;i<30;i++){
        particle(player.x,player.y,NEON.pink);
    }
    KJ.shake(6, 150);
}

function genChunk(baseX){
    const y=rnd(100,c.height-200);
    platforms.push({x:baseX,y,w:platW,h:platH,vy:0});
    // spikes on top
    spikes.push({x:baseX+20,y:grav>0?y-20:y+platH,w:30,h:20});
    // spikes on bottom
    spikes.push({x:baseX+70,y:grav>0?y-20:y+platH,w:30,h:20});
    // orb
    orbs.push({x:baseX+platW/2,y:y-40,r:10,taken:false});
    // moving platform
    if(Math.random()<0.3){
        const my=y;
        platforms.push({x:baseX+200,y:my,w:platW,h:platH,vy:Math.random()<0.5?-1:1});
    }
    // rotating hazard
    if(Math.random()<0.2){
        hazards.push({x:baseX+150,y:y-60,r:20,angle:0});
    }
}

function reset(){
    score=0;scroll=0;speed=3;lives=3;checkpoint=0;grav=1;flipCd=0;
    player.x=150;player.y=c.height/2;player.vx=0;player.vy=0;
    platforms.length=0;spikes.length=0;orbs.length=0;hazards.length=0;particles.length=0;
    for(let i=0;i<10;i++)genChunk(i*gap);
}

function update(){
    if(scene==='menu'){
        if(keys[' ']){reset();scene='play';KM.init({slug:'gravity-shift', title:'Gravity Shift', tagline:'Arrow keys to move, Space/Up to flip gravity', controls:'Arrow keys, Space/Up', world:'Platformer'});KM.trackScore(score);}
        return;
    }
    if(KM.isPaused()) return;
    if(scene==='gameover'){
        if(keys[' ']){scene='menu';}
        return;
    }
    // scroll
    scroll+=speed;
    speed+=0.001;
    if(scroll-checkpoint>500){checkpoint=scroll;lives=Math.min(lives+1,5);gsLastCheckpointLevel++;gsRunStats.distance=Math.max(gsRunStats.distance,scroll);if(gsLastCheckpointLevel%3===0)showGsUpgradeModal();gsCheckAch()}
    // input
    if(keys['ArrowLeft'])player.vx-=0.5;
    if(keys['ArrowRight'])player.vx+=0.5;
    if((keys[' ']||keys['ArrowUp'])&&flipCd<=0)flip();
    // physics
    player.vx*=0.9;
    player.vy+=0.4*grav;
    player.y+=player.vy;
    player.x+=player.vx;
    // boundaries
    if(player.x<0)player.x=0;
    if(player.x>c.width)player.x=c.width;
    // platforms
    player.on=false;
    platforms.forEach(p=>{
        p.y+=p.vy||0;
        if(p.vy){
            if(p.y<100||p.y>c.height-100)p.vy*=-1;
        }
        if(player.x+player.w>p.x&&player.x<p.x+p.w&&
           player.y+player.h>p.y&&player.y<p.y+p.h){
            if(grav>0&&player.vy>0){
                player.y=p.y-player.h;player.vy=0;player.on=true;
            }
            if(grav<0&&player.vy<0){
                player.y=p.y+p.h;player.vy=0;player.on=true;
            }
        }
    });
    // spikes
    spikes.forEach(s=>{
        if(player.x+player.w>s.x&&player.x<s.x+s.w&&
           player.y+player.h>s.y&&player.y<s.y+s.h){
            hurt();
        }
    });
    // orbs
    orbs.forEach(o=>{
        if(!o.taken&&Math.hypot(player.x+player.w/2-o.x,player.y+player.h/2-o.y)<25){
            o.taken=true;score+=10;KM.trackScore(score);for(let i=0;i<20;i++)particle(o.x,o.y,NEON.gold);KJ.pickup();
        }
    });
    // hazards
    hazards.forEach(h=>{
        h.angle+=0.05;
        const bx=h.x+Math.cos(h.angle)*h.r;
        const by=h.y+Math.sin(h.angle)*h.r;
        if(Math.hypot(player.x+player.w/2-bx,player.y+player.h/2-by)<25)hurt();
    });
    // particles
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;
        if(p.life<=0)particles.splice(i,1);
    }
    // death
    if(player.y>c.height+100||player.y<-100)hurt();
    // generate
    while(platforms.length&&platforms[0].x<scroll-200){
        platforms.shift();
        if(spikes.length)spikes.shift();
    }
    while(platforms.length*gap<scroll+c.width+gap*2)genChunk(scroll+platforms.length*gap);
    flipCd--;
}

function hurt(){
    lives--;
    for(let i=0;i<50;i++)particle(player.x,player.y,NEON.red);KJ.hit();
    if(lives<=0){
        scene='gameover';
        KM.gameOver(score, {cause:'loss', onRetry:reset});
        if(score>high){high=score;localStorage.setItem('gs_high',high);}
    }else{
        player.x=150;player.y=c.height/2;player.vx=0;player.vy=0;
        scroll=checkpoint;speed=3;
    }
}

function draw(){
    ctx.fillStyle=NEON.purple;ctx.fillRect(0,0,c.width,c.height);
    // grid
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    for(let x=-scroll%50;x<c.width;x+=50)ctx.strokeRect(x,0,1,c.height);
    // platforms
    platforms.forEach(p=>{
        ctx.fillStyle=NEON.white;
        ctx.fillRect(p.x-scroll,p.y,p.w,p.h);
    });
    // spikes
    spikes.forEach(s=>{
        ctx.fillStyle=NEON.red;
        ctx.beginPath();
        for(let i=0;i<3;i++){
            ctx.lineTo(s.x-scroll+i*10,s.y+(grav>0?20:0));
            ctx.lineTo(s.x-scroll+i*10+5,s.y+(grav>0?0:20));
        }
        ctx.fill();
    });
    // orbs
    orbs.forEach(o=>{
        if(!o.taken){
            ctx.beginPath();ctx.arc(o.x-scroll,o.y,o.r,0,Math.PI*2);
            ctx.fillStyle=NEON.gold;ctx.fill();
            ctx.shadowBlur=15;ctx.shadowColor=NEON.gold;ctx.fill();ctx.shadowBlur=0;
        }
    });
    // hazards
    ctx.strokeStyle=NEON.pink;ctx.lineWidth=3;
    hazards.forEach(h=>{
        ctx.beginPath();
        for(let i=0;i<8;i++){
            const a=i/8*Math.PI*2;
            const x=h.x+Math.cos(h.angle+a)*h.r;
            const y=h.y+Math.sin(h.angle+a)*h.r;
            ctx.lineTo(x-scroll,y);
        }
        ctx.closePath();ctx.stroke();
    });
    // player
    ctx.fillStyle=NEON.cyan;
    ctx.fillRect(player.x-scroll,player.y,player.w,player.h);
    ctx.shadowBlur=15;ctx.shadowColor=NEON.cyan;ctx.fillRect(player.x-scroll,player.y,player.w,player.h);ctx.shadowBlur=0;
    // particles
    particles.forEach(p=>{
        ctx.globalAlpha=p.life/30;
        ctx.fillStyle=p.col;ctx.fillRect(p.x-scroll,p.y,3,3);
    });
    ctx.globalAlpha=1;
    // HUD
    ctx.fillStyle=NEON.white;ctx.font='24px Orbitron';
    ctx.fillText('Score: '+score,20,40);
    ctx.fillText('High: '+high,20,70);
    ctx.fillText('Lives: '+lives,20,100);
    ctx.fillText('Speed: '+speed.toFixed(1),20,130);
    // menu
    if(scene==='menu'){
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle=NEON.cyan;ctx.font='48px Orbitron';
        ctx.textAlign='center';ctx.fillText('GRAVITY SHIFT',c.width/2,c.height/2-40);
        ctx.font='24px Orbitron';ctx.fillStyle=NEON.white;
        ctx.fillText('Arrow keys to move, Space/Up to flip gravity',c.width/2,c.height/2+20);
        ctx.fillText('Press Space to start',c.width/2,c.height/2+60);
        ctx.textAlign='left';
    }
    if(scene==='gameover'){
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle=NEON.red;ctx.font='48px Orbitron';
        ctx.textAlign='center';ctx.fillText('GAME OVER',c.width/2,c.height/2-20);
        ctx.fillStyle=NEON.white;ctx.font='24px Orbitron';
        ctx.fillText('Score: '+score,c.width/2,c.height/2+20);
        ctx.fillText('Press Space to menu',c.width/2,c.height/2+60);
        ctx.textAlign='left';
    }
}

function loop(){
    update();draw();requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
